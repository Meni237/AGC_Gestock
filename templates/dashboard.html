<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC Gestock - Tableau de bord</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f4f6f9; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: #002752; color: white; padding: 20px 0; display: flex; flex-direction: column; }
        
        .sidebar-brand { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            padding-bottom: 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            font-size: 18px; 
            font-weight: bold; 
        }
        .sidebar-logo { 
            width: 35px; 
            height: 35px; 
            border-radius: 6px; 
            object-fit: cover; 
        }

        .sidebar-menu { list-style: none; margin-top: 20px; }
        .sidebar-menu li a { display: block; padding: 12px 25px; color: #cfd8dc; text-decoration: none; font-size: 15px; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background-color: #004085; color: white; }
        .logout-btn { margin-top: auto; padding: 12px 25px; background: #c82333; color: white; text-align: center; text-decoration: none; font-weight: bold; }

        /* Contenu principal */
        .main-content { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { font-size: 14px; color: #666; margin-bottom: 10px; }
        .card .number { font-size: 28px; font-weight: bold; color: #004085; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="/static/logo_agc.JPEG" alt="AGC Logo" class="sidebar-logo">
            <span>AGC_Gestock</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/dashboard" class="active">📊 Tableau de bord</a></li>
            <li><a href="/items">📦 Stock / Articles</a></li>
            <li><a href="#">📋 Mouvements</a></li>
            <li><a href="#">👥 Utilisateurs</a></li>
        </ul>
        <a href="/" class="logout-btn">Déconnexion</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Tableau de Bord</h2>
            <span>Bienvenue, <strong>Admin</strong></span>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>Total Articles en Stock</h3>
                <div class="number">{{ total_items }}</div>
            </div>
            <div class="card">
                <h3>Entrées (ce mois)</h3>
                <div class="number">0</div>
            </div>
            <div class="card">
                <h3>Sorties (ce mois)</h3>
                <div class="number">0</div>
            </div>
            <div class="card">
                <h3>Alertes Stock Bas</h3>
                <div class="number" style="color: #dc3545;">{{ low_stock }}</div>
            </div>
        </div>
    </div>

</body>
</html>
